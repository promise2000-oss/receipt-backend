# Eleosstyles Receipt System — Render Blueprint (free tier)
#
# Render reads this file and creates the whole deployment:
#
#   * one web service, built from ./Dockerfile (the Express API)
#   * one managed PostgreSQL 17 database
#
# Setup:
#   1. Push this repo to GitHub — see AGENTS.md, `.playwright-mcp/` must never
#      be committed (it is gitignored).
#   2. Render dashboard → New → Blueprint → select the repo.
#   3. Browse https://eleosstyles.onrender.com/api/docs to explore the API.
#
# Why one service? The API is the entire product: JSON under /api, the
# standalone receipt pages behind share links, PDF generation, and Swagger UI
# at /api/docs. Nothing else needs to serve traffic.
#
# ---------------------------------------------------------------------------
# FREE TIER — what you are signing up for (docs.render.com/free)
#
#   * 0.1 CPU / 512 MB RAM. Chromium is the big consumer when it prints a
#     PDF, so budget carefully — pdf.ts already passes --no-sandbox,
#     --disable-dev-shm-usage and --disable-gpu for exactly this environment.
#   * Spins down after 15 minutes of no traffic; the first request then takes
#     ~60 s to wake it up.
#   * 750 free instance hours per month; spun-down time does not count.
#   * NO persistent disks on the free plan → uploaded logos and generated
#     PDFs are deleted on every re-deploy, restart *and* spin-down. Keep
#     STORAGE_DRIVER=local only while demoing; for anything real, switch to
#     S3-compatible storage (Cloudflare R2 has a free tier) — env vars below.
#   * SMTP is blocked (ports 25/465/587), so mail can only be logged with
#     MAIL_DRIVER=console.
#   * Free Postgres: 1 GB, no backups, and it EXPIRES 30 DAYS AFTER CREATION
#     (14-day grace to upgrade, then the data is deleted).
#
# To upgrade later: set `plan:` below to a paid compute plan (free is $0,
# 0.5c-512mb is $7/mo, 1c-2g is $25/mo) and re-enable the commented `disk:`
# block — disks only exist on paid plans.
# ---------------------------------------------------------------------------

version: "1"

services:
  - type: web
    name: eleosstyles-receipts
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `free` = 0.1 CPU / 512 MB. Disks are unavailable at this tier, which is
    # why there is no `disk:` block in the active config.
    plan: free
    # Probes GET /api/health on the public port.
    healthCheckPath: /api/health
    # Migrations run in the container's CMD, and each instance would run them
    # on boot — stay at one instance unless you move them to preDeployCommand.
    numInstances: 1
    # ── when you move off `free`, uncomment this to survive re-deploys ──
    # disk:
    #   name: eleosstyles-files
    #   mountPath: /data/storage
    #   sizeGB: 1
    envVars:
      # Supplied by Render from the database declared below.
      - key: DATABASE_URL
        fromDatabase:
          name: eleosstyles-db
          property: connectionString
      # 256-bit, generated once and stored as a secret. Sessions break if it
      # ever changes, so do not regenerate it casually.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Ephemeral on the free plan: re-deploys and spin-downs erase this
      # directory. Switch to S3 for durability:
      #   STORAGE_DRIVER=s3
      #   S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com
      #   S3_REGION=auto
      #   S3_BUCKET=receipts
      #   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
      #   S3_FORCE_PATH_STYLE=true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /data/storage
      # `console` logs mail instead of sending it — the only option on the
      # free plan, which blocks outbound SMTP. For paid SMTP, set
      # MAIL_DRIVER=smtp plus SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS.
      - key: MAIL_DRIVER
        value: console
      # Swagger UI at /api/docs — set to "false" to take it down.
      - key: DOCS_ENABLED
        value: "true"
      # Share links and CORS default to Render's own RENDER_EXTERNAL_URL (see
      # apps/api/src/lib/env.ts), so no public URL has to be hard-coded here.
      # Uncomment only to override, e.g. after adding a custom domain:
      # - key: PUBLIC_API_BASE_URL
      #   value: https://receipts.example.com
      # - key: API_ORIGIN
      #   value: https://receipts.example.com

databases:
  - name: eleosstyles-db
    databaseName: eleosstyles
    user: eleos
    # Matches docker-compose (postgres:17) and Prisma 6's tested range.
    postgresMajorVersion: "17"
    # Free: 1 GB, no backups, EXPIRES 30 DAYS AFTER CREATION (then a 14-day
    # grace period before deletion). Use `free` while evaluating; move to
    # 0.1c-256mb ($6/mo) or higher before you care about the data.
    plan: free
